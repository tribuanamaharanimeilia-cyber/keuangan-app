<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Catatan Keuangan Modern</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins', sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:500px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:25px;
  padding:25px;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
  color:white;
}

h2{
  text-align:center;
  margin-bottom:20px;
  font-size:28px;
  font-weight:700;
}

.balance-card{
  background: rgba(255,255,255,0.15);
  border-radius:20px;
  padding:20px;
  text-align:center;
  margin-bottom:20px;
}

.balance-card h3{
  font-size:16px;
  font-weight:400;
  margin-bottom:8px;
}

.balance-card span{
  font-size:32px;
  font-weight:700;
}

.form-group{
  margin-bottom:15px;
}

input, select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background: rgba(255,255,255,0.2);
  color:white;
  outline:none;
  font-size:14px;
}

input::placeholder{
  color:#eee;
}

select option{
  color:black;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background:#00e676;
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  opacity:0.9;
}

.list{
  margin-top:20px;
  max-height:250px;
  overflow-y:auto;
}

.item{
  background: rgba(255,255,255,0.12);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.item-left h4{
  font-size:15px;
}

.item-left p{
  font-size:12px;
  opacity:0.8;
}

.amount{
  font-weight:700;
}

.masuk{
  color:#00ff9d;
}

.keluar{
  color:#ff6b81;
}

.action{
  display:flex;
  gap:6px;
}

.edit{
  background:orange;
  width:40px;
  height:40px;
  border-radius:10px;
}

.hapus{
  background:red;
  width:40px;
  height:40px;
  border-radius:10px;
}

canvas{
  margin-top:25px;
  background:white;
  border-radius:20px;
  padding:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>💸 Catatan Keuangan</h2>

<div class="balance-card">
  <h3>Total Saldo</h3>
  <span id="total">Rp 0</span>
</div>

<div class="form-group">
  <input id="desc" placeholder="Masukkan deskripsi">
</div>

<div class="form-group">
  <input id="jumlah" type="number" placeholder="Masukkan jumlah">
</div>

<div class="form-group">
  <select id="tipe">
    <option value="masuk">Pemasukan</option>
    <option value="keluar">Pengeluaran</option>
  </select>
</div>

<button onclick="tambah()">+ Tambah Transaksi</button>

<div class="list" id="list"></div>

<canvas id="chart"></canvas>

</div>

<script>
let chart;

async function loadData() {
  const res = await fetch("/data");
  const data = await res.json();

  const list = document.getElementById("list");
  const totalEl = document.getElementById("total");

  list.innerHTML = "";

  let total = 0;
  let masuk = 0;
  let keluar = 0;

  data.forEach(item => {

    const div = document.createElement("div");
    div.className = "item";

    let kelas = item.tipe === "masuk" ? "masuk" : "keluar";
    let simbol = item.tipe === "masuk" ? "+" : "-";

    div.innerHTML = `
      <div class="item-left">
        <h4>${item.deskripsi}</h4>
        <p>${item.tipe}</p>
      </div>

      <div>
        <div class="amount ${kelas}">
          ${simbol} Rp ${Number(item.jumlah).toLocaleString("id-ID")}
        </div>

        <div class="action">
          <button class="edit" onclick="edit(${item.id})">✏️</button>
          <button class="hapus" onclick="hapus(${item.id})">🗑️</button>
        </div>
      </div>
    `;

    list.appendChild(div);

    if(item.tipe === "masuk"){
      total += item.jumlah;
      masuk += item.jumlah;
    }else{
      total -= item.jumlah;
      keluar += item.jumlah;
    }
  });

  totalEl.innerText =
    "Rp " + total.toLocaleString("id-ID");

  renderChart(masuk, keluar);
}

function renderChart(masuk, keluar){

  const ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:"doughnut",
    data:{
      labels:["Pemasukan","Pengeluaran"],
      datasets:[{
        data:[masuk, keluar],
        backgroundColor:[
          "#00e676",
          "#ff5252"
        ],
        borderWidth:0
      }]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{
          labels:{
            color:"black"
          }
        }
      }
    }
  });
}

async function tambah(){

  const deskripsi =
    document.getElementById("desc").value;

  const jumlah =
    document.getElementById("jumlah").value;

  const tipe =
    document.getElementById("tipe").value;

  await fetch("/data",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      deskripsi,
      jumlah,
      tipe
    })
  });

  loadData();
}

async function hapus(id){
  await fetch(`/data/${id}`,{
    method:"DELETE"
  });

  loadData();
}

async function edit(id){

  const deskripsi =
    prompt("Deskripsi baru:");

  const jumlah =
    prompt("Jumlah baru:");

  const tipe =
    prompt("masuk / keluar:");

  await fetch(`/data/${id}`,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      deskripsi,
      jumlah,
      tipe
    })
  });

  loadData();
}

loadData();
</script>

</body>
</html>
